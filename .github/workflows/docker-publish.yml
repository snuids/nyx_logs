name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    # A licence, documentation or workflow change does not change the image.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'LICENCE'
      - '.github/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The image is tagged with the version the commit message starts with (`v1.4`, `v1.5 Fix ...`).
    # The condition used to sit under `on.push`, where GitHub ignores it: every merge to `main`
    # started a build whose tag was the whole commit message — "Theme support: follow the URL …" is
    # not a valid tag, so the run failed after ten minutes. It belongs here.
    if: startsWith(github.event.head_commit.message, 'v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Only the first word of the message is the tag: `v1.5 Fix the spinner` publishes `v1.5`.
      - name: Read the version from the commit message
        id: version
        run: |
          tag=$(printf '%s' "$MESSAGE" | head -n 1 | awk '{print $1}')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag retenu : $tag"
        env:
          MESSAGE: ${{ github.event.head_commit.message }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/nyx_logs:${{ steps.version.outputs.tag }}
