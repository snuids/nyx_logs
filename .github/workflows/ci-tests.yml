name: CI - Tests

# `npm run test:coverage` lance la suite (vitest + jsdom) et mesure **tous** les fichiers de `src/` :
# avant, c8 ne mesurait que ce que les tests importaient — un module — et le depot affichait 85 %
# alors que deux tiers du code n'avait aucun test. Le plancher vit dans `vitest.config.mjs`.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mjs'
      - 'tsconfig*.json'
      - '.github/workflows/ci-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mjs'
      - 'tsconfig*.json'
      - '.github/workflows/ci-tests.yml'
  workflow_dispatch:

permissions:
  # for the badge on the `badges` branch (main only)
  contents: write

concurrency:
  group: logs-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test and check the coverage floor
        run: npm run test:coverage

      - name: Write the badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f coverage/coverage-summary.json
          pct=$(node -e "process.stdout.write(String(require('./coverage/coverage-summary.json').total.statements.pct))")
          # la couleur suit la valeur : un chiffre bas ne doit pas se lire comme rassurant
          colour=$(node -e "
            const v = Number('$pct');
            const c = v >= 92 ? 'brightgreen' : v >= 85 ? 'green' : v >= 75 ? 'yellowgreen'
                    : v >= 60 ? 'yellow' : v >= 40 ? 'orange' : 'red';
            process.stdout.write(c);")
          mkdir -p coverage
          printf '{\n  "schemaVersion": 1,\n  "label": "coverage",\n  "message": "%s%%",\n  "color": "%s",\n  "value": %s\n}\n' "$pct" "$colour" "$pct" > coverage/badge.json
          cat coverage/badge.json

      - name: Publish the coverage badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f coverage/badge.json
          cd "$RUNNER_TEMP"
          git init -q badges
          cd badges
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin badges || true
          if git rev-parse --verify -q origin/badges >/dev/null; then
            git checkout -q -b badges origin/badges
          else
            git checkout -q --orphan badges
          fi
          cp "$GITHUB_WORKSPACE/coverage/badge.json" coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "coverage: ${GITHUB_SHA::7}"
          git push -q origin badges
        env:
          GITHUB_TOKEN: ${{ github.token }}
